  #   - secretKey: DB_PASS
  #     remoteRef:
  #       key: hof-rds-api-asc
  #       property: db_pass
  #   - secretKey: DB_NAME
  #     remoteRef:
  #       key: hof-rds-api-asc
  #       property: db_name

networkPolicy:
  enabled: false
