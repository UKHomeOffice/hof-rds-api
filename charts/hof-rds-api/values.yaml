replicaCount: 1

# Base chart defaults only.
# Pass environment-specific values from hof-deploy overlays.
nameOverride: ""
fullnameOverride: ""

commonLabels: {}

image:
  repository: quay.io/ukhomeofficedigital/hof-rds-api
  tag: "3.1.0@sha256:e73edb96b62bc5dbce4e56b49ac41e7b7bf2e601fb7b0b71dbd19251c8a8e317"
  pullPolicy: Always

containerName: hof-rds-api

imagePullSecrets: []

selectorLabels: {}

serviceAccount:
  create: false
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

# Optional container command override.
# Keep null to use the image default CMD/ENTRYPOINT.
command: null

podSecurityContext:
  {}

securityContext:
  runAsNonRoot: true
  allowPrivilegeEscalation: false

containerPort: 3443

extraVolumeMounts: []

extraVolumes: []

service:
  name: ""
  type: ClusterIP
  port: 10443
  targetPort: 3443
  portName: https

ingress:
  enabled: false
  # Keep disabled for initial validation.
  # className: nginx-external
  # annotations: {}
  # hosts:
  #   - host: data-service-my-branch.asc-branch.homeoffice.gov.uk
  #     paths:
  #       - path: /
  #         pathType: Prefix
  # tls:
  #   - hosts:
  #       - data-service-my-branch.asc-branch.homeoffice.gov.uk
  #     secretName: branch-tls-external

resources:
  requests:
    cpu: 20m
    memory: 20Mi
  limits:
    cpu: 300m
    memory: 256Mi

autoscaling:
  enabled: false
  # minReplicas: 1
  # maxReplicas: 3
  # targetCPUUtilizationPercentage: 80

nodeSelector: {}
tolerations: []
affinity: {}

# Example:
defaultEnv:
  - name: SERVICE_NAME
    value: asc
  - name: LATEST_MIGRATION
    value: "20230818160728_add_job_role_column_sa"
  - name: DB_HOST
    valueFrom:
      secretKeyRef:
        name: asc-rds
        key: endpoint
  - name: DB_NAME
    valueFrom:
      secretKeyRef:
        name: asc-rds
        key: db_name
  - name: DB_USER
    valueFrom:
      secretKeyRef:
        name: asc-rds
        key: username
  - name: DB_PASS
    valueFrom:
      secretKeyRef:
        name: asc-rds
        key: password

# Optional env overrides. Supports either:
# 1) a list of {name, value}/{name, valueFrom}, or
# 2) a key/value map for simple string env vars.
env: null

envFrom: []
# Optional:
# envFrom:
#   - configMapRef:
#       name: configmap-my-branch

configMap:
  enabled: false
  # name: configmap-my-branch
  # data: {}

secrets:
  enabled: false
  # name: ""
  # data:
  #   DB_HOST: "postgres.example"
  #   DB_USER: "app_user"
  #   DB_PASS: "app_pass"
  #   DB_NAME: "app_db"

externalSecret:
  enabled: false
  # refreshInterval: 1h
  # secretStoreRef:
  #   name: aws-secretstore
