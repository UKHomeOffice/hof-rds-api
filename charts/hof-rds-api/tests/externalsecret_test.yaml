suite: ExternalSecret rendering
templates:
  - templates/externalsecret.yaml

tests:
  - it: should render ExternalSecret when enabled without externalSecret.target values
    set:
      externalSecret.enabled: true
      externalSecret.refreshInterval: 1h
      externalSecret.secretStoreRef.name: aws-secretstore
      externalSecret.secretStoreRef.kind: SecretStore
      externalSecret.data[0].secretKey: DB_HOST
      externalSecret.data[0].remoteRef.key: hof-rds-api-acq
      externalSecret.data[0].remoteRef.property: db_host
    asserts:
      - isKind:
          of: ExternalSecret
      - equal:
          path: spec.target.creationPolicy
          value: Owner

  - it: should use target.name when provided
    set:
      externalSecret.enabled: true
      externalSecret.secretStoreRef.name: aws-secretstore
      externalSecret.secretStoreRef.kind: SecretStore
      externalSecret.target.name: custom-runtime-secret
      externalSecret.target.creationPolicy: Merge
    asserts:
      - equal:
          path: spec.target.name
          value: custom-runtime-secret
      - equal:
          path: spec.target.creationPolicy
          value: Merge
