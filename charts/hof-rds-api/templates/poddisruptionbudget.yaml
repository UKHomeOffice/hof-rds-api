{{- if .Values.podDisruptionBudget.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "hof-rds-api.fullname" . }}
  labels:
    {{- include "hof-rds-api.labels" . | nindent 4 }}
spec:
  minAvailable: {{ .Values.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      {{- include "hof-rds-api.selectorLabels" . | nindent 6 }}
{{- end }}
