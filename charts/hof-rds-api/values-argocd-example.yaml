# Example values for ArgoCD deployment of hof-rds-api
# Apply via your ArgoCD Application source.helm.valueFiles or values block.

image:
  # Replace with your ECR/registry image path used by build-scan-push workflow
  repository: hof/hof-rds-api
  tag: latest

replicaCount: 2

# Core runtime configuration required by the service
env:
  NODE_ENV: production
  PORT: "3001"
  SERVICE_NAME: asc
  LATEST_MIGRATION: ""
  DELETE_EXPIRED_SCHEDULE: "0 0 * * *"
  UPDATE_BANK_HOLIDAYS_SCHEDULE: "0 0 1 * *"

service:
  type: ClusterIP
  port: 80
  targetPort: 3001

ingress:
  enabled: false

# Use External Secrets Operator in cluster to materialize DB credentials
externalSecret:
  enabled: true
  refreshInterval: 1h
  secretStoreRef:
    name: platform-cluster-secret-store
    kind: ClusterSecretStore
  target:
    # Optional, defaults to release fullname when empty
    name: ""
    creationPolicy: Owner
  data:
    - secretKey: DB_HOST
      remoteRef:
        key: /prod/hof-rds-api
        property: db_host
    - secretKey: DB_USER
      remoteRef:
        key: /prod/hof-rds-api
        property: db_user
    - secretKey: DB_PASS
      remoteRef:
        key: /prod/hof-rds-api
        property: db_pass
    - secretKey: DB_NAME
      remoteRef:
        key: /prod/hof-rds-api
        property: db_name

# Hardening and availability
networkPolicy:
  enabled: true
  egress:
    allowDns: true
    dnsNamespace: kube-system
    additionalTo: []
    ports:
      - protocol: TCP
        port: 5432

podDisruptionBudget:
  enabled: true
  minAvailable: 1

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

# Enable only if Prometheus Operator is installed in the cluster
serviceMonitor:
  enabled: false
