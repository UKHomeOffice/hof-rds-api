name: Publish Helm chart to ECR

on:
  push:
    branches:
      - main
    tags:
      - "v*"
      - "[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      chart_directory:
        description: "Path to Helm chart directory"
        required: false
        default: "charts/hof-rds-api"
        type: string
      helm_version:
        description: "Helm version (leave empty to use workflow default)"
        required: false
        default: ""
        type: string
      validate_version_tag:
        description: "Require git tag to match chart version"
        required: false
        default: true
        type: boolean
  workflow_call:
    inputs:
      chart_directory:
        required: false
        type: string
        default: "charts/hof-rds-api"
      helm_version:
        required: false
        type: string
        default: ""
      validate_version_tag:
        required: false
        type: boolean
        default: true

jobs:
  publish-chart:
    uses: Home-Office-Digital/core-cloud-workflow-helm-ecr-actions/.github/workflows/publish-helm-ecr.yml@1.0.0
    with:
      aws_region: eu-west-2
      aws_role_to_assume: arn:aws:iam::335721753278:role/cc-hof-hof-rds-api-notprod-ecr-push
      chart_directory: ${{ inputs.chart_directory || github.event.inputs.chart_directory || 'charts/hof-rds-api' }}
      helm_version: ${{ inputs.helm_version || github.event.inputs.helm_version || '' }}
      validate_version_tag: ${{ inputs.validate_version_tag != null && inputs.validate_version_tag || github.event.inputs.validate_version_tag != null && github.event.inputs.validate_version_tag || true }}
      create_repository: false
    secrets:
      ecr_account_id: ${{ secrets.AWS_ECR_ACCOUNT_ID }}
      
