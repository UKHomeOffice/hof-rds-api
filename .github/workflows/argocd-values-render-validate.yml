name: Validate ArgoCD values rendering

on:
  pull_request:
    branches:
      - master
      - CCL-*
    paths:
      - charts/hof-rds-api/**
      - .github/workflows/argocd-values-render-validate.yml
  push:
    branches:
      - master
      - CCL-*
    paths:
      - charts/hof-rds-api/**
      - .github/workflows/argocd-values-render-validate.yml
  workflow_dispatch:

jobs:
  render-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout chart repository
        uses: actions/checkout@v4

      - name: Checkout deployment values repository
        uses: actions/checkout@v4
        with:
          repository: UKHomeOffice/hof-deploy
          path: hof-deploy

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.1

      - name: Render chart with prod and uat service overlays
        shell: bash
        run: |
          set -euo pipefail
          chart_dir="charts/hof-rds-api"
          services=(acq asc csl ima nrm paf)

          for svc in "${services[@]}"; do
            helm template "prod-${svc}" "${chart_dir}" \
              -f hof-deploy/argocd/prod/hof-rds-api/values.yaml \
              -f "hof-deploy/argocd/prod/hof-rds-api/services/${svc}.yaml" \
              > /dev/null

            helm template "uat-${svc}" "${chart_dir}" \
              -f hof-deploy/argocd/notprod/uat/hof-rds-api/values.yaml \
              -f "hof-deploy/argocd/notprod/uat/hof-rds-api/services/${svc}.yaml" \
              > /dev/null
          done

      - name: Render chart with ephemeral values
        shell: bash
        run: |
          set -euo pipefail
          helm template ephemeral charts/hof-rds-api \
            -f hof-deploy/argocd/notprod/ephemeral/hof-rds-api/values.yaml \
            > /dev/null
